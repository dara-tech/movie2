<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HLS Test Player</title>
    <style>
      body { font-family: sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
      video { width: 100%; background: #000; border-radius: 8px; }
      input { width: 100%; padding: 10px; margin: 12px 0; }
      button { padding: 10px 16px; cursor: pointer; }
      pre { background: #111; color: #ddd; padding: 12px; border-radius: 8px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>HLS Test Player</h1>
    <input id="url" placeholder="Paste your authorized .m3u8 URL" />
    <button id="load">Load Stream</button>
    <video id="video" controls playsinline></video>
    <pre id="log"></pre>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
      const video = document.getElementById("video");
      const log = document.getElementById("log");
      const input = document.getElementById("url");
      let hls;

      function write(msg) {
        log.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + log.textContent;
      }

      document.getElementById("load").addEventListener("click", () => {
        const src = input.value.trim();
        if (!src) return write("Please enter a playlist URL.");

        if (hls) {
          hls.destroy();
          hls = null;
        }

        // Safari can play HLS natively
        if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = src;
          video.play().catch(() => {});
          write("Loaded with native HLS.");
          return;
        }

        // Other browsers via hls.js
        if (window.Hls && Hls.isSupported()) {
          hls = new Hls({
            enableWorker: true,
            lowLatencyMode: false
          });

          hls.attachMedia(video);
          hls.on(Hls.Events.MEDIA_ATTACHED, () => {
            hls.loadSource(src);
            write("Media attached. Loading source...");
          });

          hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
            write(`Manifest parsed. Levels: ${data.levels?.length ?? 0}`);
            video.play().catch(() => {});
          });

          hls.on(Hls.Events.ERROR, (_, data) => {
            write(`HLS error: ${data.type} | ${data.details} | fatal=${data.fatal}`);
            if (data.fatal) {
              if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                hls.startLoad();
              } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                hls.recoverMediaError();
              } else {
                hls.destroy();
              }
            }
          });

          return;
        }

        write("HLS not supported in this browser.");
      });
    </script>
  </body>
</html>
